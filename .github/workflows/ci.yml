name: ci

on:
  push:
    branches: [dev, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt · lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The desktop binary embeds frontend/dist, so the frontend must be
      # built before any Go compile step on a fresh checkout.
      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # frontend/bindings is generated, not committed. wails3 generate
      # bindings scans main.go, which embeds all:frontend/dist, so a
      # placeholder dist must exist first; the real frontend build
      # below overwrites it.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...

      - name: Build frontend assets
        run: npm run build --prefix frontend

      - name: Test frontend
        run: npm run test --prefix frontend

      - name: Format check (frontend)
        run: npm run format:check --prefix frontend

      - name: Format (gofmt)
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required on:"
            echo "$files"
            exit 1
          fi

      - name: execd protobuf drift
        run: |
          sudo apt-get install -y protobuf-compiler
          make gen-proto-check

      - name: Vet (go vet)
        run: go vet ./...

      - name: Dependency boundaries
        run: ./scripts/check-boundaries.sh

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Vulnerability scan (govulncheck)
        # Pinned: v1.8.0+ requires Go >= 1.26 while this repo builds on
        # go.mod's 1.25 toolchain (GOTOOLCHAIN=local). Bump together with
        # the Go version instead of tracking @latest.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Frontend dependency audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          out="$(npm audit --omit=dev --json 2>&1)"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # npm's legacy audit endpoint is being retired and
          # intermittently returns 400/503. Real vulnerability findings
          # still fail the job; only endpoint outages are skipped.
          if printf '%s' "$out" | grep -Eq 'Bad Request|Service Unavailable|audit endpoint returned an error|This endpoint is being retired'; then
            echo "npm audit endpoint unavailable; skipping audit"
            exit 0
          fi
          printf '%s\n' "$out"
          exit "$code"

      # Sandbox tests (app/sandbox/execd) build a bwrap-backed runtime.
      - name: Install sandbox dependency (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Build
        run: go build ./...

      - name: Test (race)
        # bwrap needs a user namespace, but the Ubuntu 24.04 runner
        # blocks unprivileged userns (apparmor_restrict_unprivileged_userns).
        # Running as root keeps the real bwrap sandbox path exercised.
        # The two rollback tests below rely on permission-denied writes,
        # which root bypasses, so they run as the regular user instead.
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            "GOPATH=$(go env GOPATH)" \
            "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" \
            go test -race -skip 'Test(Create|Update)RollsBackOnPersistFailure$' ./...
          go test -race -run 'Test(Create|Update)RollsBackOnPersistFailure$' ./internal/capabilities/agents

      - name: Modules tidy
        run: go mod tidy -diff

      # Timing-sensitive performance assertions are skipped under -race
      # (above), so run them once without the race detector.
      - name: Performance threshold assertions
        run: go test -count=1 ./internal/capabilities/sessions ./internal/capabilities/tools/files ./internal/adapters/desktop ./internal/capabilities/worldstate

  frontend-e2e:
    name: frontend e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # bindings are generated, not committed; npm run build (tsc) needs them.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...

      - name: Build frontend assets
        run: npm run build --prefix frontend

      - name: Install Playwright browsers
        # webkit runs the perf budget spec (it matches the desktop app's
        # JSC/WKWebView engine); the rest of the suite stays on chromium.
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend

      - name: Run Playwright E2E
        run: npm run test:e2e --prefix frontend

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...
      - name: Build frontend assets
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Platform tests (sandbox/execd/desktop/sessions)
        run: go test -count=1 ./internal/capabilities/sandbox ./internal/capabilities/execd ./internal/adapters/desktop ./internal/capabilities/sessions
      # The platform primitives have a macOS-specific half that a linux
      # run never touches: sysfont reads CoreText, procmem reads mach
      # task info, guilock binds the unix socket endpoint and wslock
      # takes flock. All 34 cases in the packages below run here (0 skips
      # on this lane: procmem's "no process probe" and sysfont's "no
      # font catalogue" skips belong to other platforms).
      # -v is there so those counts are checkable from the log rather than
      # from a reading of the case list: every case prints its own line.
      - name: Platform primitives (macos)
        run: go test -v -count=1 ./internal/foundation/platform/sysfont ./internal/foundation/platform/procmem ./internal/foundation/platform/fshidden ./internal/foundation/platform/guilock ./internal/foundation/platform/wslock
      # The pet window's own half: geometry/hover/mind/pack are pure, so
      # the whole package runs (45 cases) and the darwin cursor + DPI
      # build is exercised on the platform it is written for.
      - name: Pet window (macos)
        run: go test -v -count=1 ./internal/adapters/desktop/pet

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          New-Item -ItemType File -Force frontend/dist/.gitkeep | Out-Null
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...
        shell: pwsh
      - name: Build frontend assets
        run: npm ci --prefix frontend; npm run build --prefix frontend
        shell: pwsh
      # Windows-specific value is the real OS sandbox backend. The full
      # unit suites in these packages are Unix-mode/file-handle
      # sensitive (POSIX permission asserts, SQLite cleanup on TempDir
      # removal, POSIX shell fixtures), so Windows runs the sandbox
      # contract suite plus a compile check of the rest.
      - name: Sandbox contract (windows)
        run: go test -count=1 ./internal/capabilities/sandbox -run TestSandboxRunnerContract
        shell: pwsh
      # The exec tools are fake-runner tests, so they run everywhere;
      # they own the platform shell wiring (PowerShell detection on
      # Windows) and the Windows bare-word rules, which is exactly what
      # a Linux-only run cannot see.
      - name: Exec tools (windows)
        run: go test -count=1 ./internal/capabilities/tools/exec ./internal/foundation/platform/shelldetect
        shell: pwsh
      # Workspace paths are slash-separated on every platform, and this is
      # the lane where getting that wrong shows: list_dir's depth
      # arithmetic reads every path as depth 0 if it counts the host
      # separator, so max_depth stops trimming. The rest of the file
      # tools are covered by the full suite on linux, but a
      # separator-shaped bug only fails here.
      - name: File tools (windows)
        run: go test -count=1 ./internal/capabilities/tools/files
        shell: pwsh
      # The patch engine is the other place that judges a path with
      # filepath: on Windows "..\x" is what filepath.Clean produces for
      # "../x", so a traversal check spelled against the host separator
      # goes blind exactly where it is needed. The drive and UNC forms
      # below are absolute only to Windows, so this lane is the only one
      # that can run the assertions.
      - name: Patch engine (windows)
        run: go test -count=1 ./internal/foundation/utils/patch
        shell: pwsh
      # The channel this package exists for is the one a POSIX run never
      # reaches: a named pipe with an SDDL, plus the job-object child.
      # The scenario tests drive the child through /bin/sh (or plain
      # POSIX signal/process-group semantics), so 26 of the 44 cases call
      # requirePOSIXChild and report as skips -- see
      # internal/capabilities/execd/posix_child_test.go. What runs here is
      # the 18 shell-free cases: the wire protocol, the frame writer, the
      # orphan journal, the pool's bookkeeping, the fuzz seeds, and the
      # real child that LaunchExe starts over the pipe (the one step that
      # compiles the app binary, via buildOpencraft).
      # These are skips, not deletions: a renamed or added case fails this
      # lane loudly instead of being silently excluded from it.
      # -v prints a line per case, which is where the counts above are
      # read from after a run; they were checked against the 2026-09-26
      # windows run (44 = 18 pass + 26 skip).
      - name: execd protocol + named-pipe launch (windows)
        run: go test -v -count=1 ./internal/capabilities/execd
        shell: pwsh
      # The primitives whose Windows half is behind a build tag: the
      # FILE_ATTRIBUTE_HIDDEN branch of fshidden (its only test file is
      # //go:build windows, so this lane is the only place it can run),
      # guilock's named-pipe endpoint over its named-mutex lock, and
      # wslock's LockFileEx. 17 cases run, 2 skip: guilock's stale-socket
      # cleanup and socket path-length fallback assert the on-disk unix
      # socket and call requireUnixSocketEndpoint.
      # -v prints a line per case, which is where those counts are read
      # from after a run.
      - name: Platform primitives (windows)
        run: go test -v -count=1 ./internal/foundation/platform/fshidden ./internal/foundation/platform/guilock ./internal/foundation/platform/wslock
        shell: pwsh
      - name: Compile check (sandbox/desktop/sessions/secrets)
        run: go vet ./internal/capabilities/sandbox ./internal/adapters/desktop ./internal/capabilities/sessions ./internal/capabilities/secrets
        shell: pwsh

  desktop-linux:
    name: desktop build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...

      - name: Build frontend assets
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Build desktop binary
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go build -tags production .

  desktop-macos:
    name: desktop build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...

      - name: Build frontend assets
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Build desktop binary
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go build -tags production .

  desktop-windows:
    name: desktop build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          New-Item -ItemType File -Force frontend/dist/.gitkeep | Out-Null
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...
        shell: pwsh

      - name: Build frontend assets
        run: npm ci --prefix frontend; npm run build --prefix frontend
        shell: pwsh

      - name: Build desktop binary
        run: |
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          go build -tags production .
        shell: pwsh
