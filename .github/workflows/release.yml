name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: package (macos)
    runs-on: macos-latest
    environment: macos-release
    # Apple signing/notarization secrets: mapped to job env so the
    # guarded steps below can check their presence (the secrets context
    # is not available in step-level `if` conditions).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      # App Store Connect API key (preferred for CI): the .p8 private key,
      # its Key ID, and the Issuer ID.
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # Legacy Apple ID + app-specific password mode (fallback).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.17

      - name: Generate bindings and build frontend
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Set release version in build assets
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          ver="${TAG#v}"
          sed -i.bak "s/version: \"0.1.0\"/version: \"$ver\"/" build/config.yml
          rm build/config.yml.bak
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task common:update:build-assets

      - name: Build macOS universal app
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task darwin:package:universal VERSION="${TAG#v}"

      # Code signing and notarization are optional: they activate only
      # when the Apple secrets are configured (see the README for how to
      # create the Developer ID certificate and secrets).
      - name: Sign macOS app (Developer ID)
        if: ${{ env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.KEYCHAIN_PASSWORD != '' }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/dev-id.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/dev-id.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity="$(security find-identity -v -p codesigning build.keychain \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          codesign --force --options runtime --timestamp \
            --sign "$identity" bin/OpenCraft.app
          codesign --verify --deep --strict bin/OpenCraft.app

      - name: Install create-dmg
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg

      - name: Package dmg
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          rm -rf dmg-staging
          mkdir -p dmg-staging
          cp -R bin/OpenCraft.app dmg-staging/OpenCraft.app
          # Standard "drag to Applications" layout: branded background,
          # /Applications drop link, and Finder-generated .DS_Store.
          create-dmg \
            --volname "OpenCraft" \
            --background "build/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 128 \
            --icon "OpenCraft.app" 186 136 \
            --app-drop-link 580 136 \
            --hide-extension "OpenCraft.app" \
            --overwrite \
            "opencraft-${TAG#v}-macos-universal.dmg" \
            dmg-staging

      - name: Sign dmg (Developer ID)
        if: ${{ env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.KEYCHAIN_PASSWORD != '' }}
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          identity="$(security find-identity -v -p codesigning build.keychain \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          dmg="opencraft-${TAG#v}-macos-universal.dmg"
          codesign --force --timestamp --sign "$identity" "$dmg"
          codesign --verify --verbose=2 "$dmg"

      - name: Notarize and staple dmg
        if: ${{ (env.APPLE_API_PRIVATE_KEY != '' && env.APPLE_API_KEY != '' && env.APPLE_API_ISSUER != '') || (env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '') }}
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -o pipefail
          dmg="opencraft-${TAG#v}-macos-universal.dmg"
          xcrun notarytool --version
          if [ -n "$APPLE_API_PRIVATE_KEY" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > /tmp/AuthKey.p8
            chmod 600 /tmp/AuthKey.p8
            first_line="$(head -1 /tmp/AuthKey.p8)"
            echo "AuthKey.p8: $(wc -c < /tmp/AuthKey.p8) bytes"
            if ! printf '%s\n' "$first_line" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
              echo "::error::APPLE_API_PRIVATE_KEY is not a raw PEM .p8 (expected to start with '-----BEGIN PRIVATE KEY-----', got '${first_line:0:40}'). Re-paste the full AuthKey.p8 file contents (including the BEGIN/END lines) into the secret."
              exit 1
            fi
            xcrun notarytool submit "$dmg" --key /tmp/AuthKey.p8 \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait \
              2>&1 | tee /tmp/notary.log
            status=${PIPESTATUS[0]}
          else
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait \
              2>&1 | tee /tmp/notary.log
            status=${PIPESTATUS[0]}
          fi
          sub_id="$(sed -n 's/.*id: \([0-9a-fA-F-]\{36\}\).*/\1/p' /tmp/notary.log | head -1)"
          if [ $status -ne 0 ] ||
            grep -Eq 'status: (Invalid|Rejected)' /tmp/notary.log; then
            echo "::error::notarization failed (exit ${status})"
            if [ -n "$sub_id" ]; then
              if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
                xcrun notarytool log "$sub_id" \
                  --key /tmp/AuthKey.p8 \
                  --key-id "$APPLE_API_KEY" \
                  --issuer "$APPLE_API_ISSUER" || true
              else
                xcrun notarytool log "$sub_id" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
              fi
            fi
            exit 1
          fi
          xcrun stapler staple "$dmg"
          {
            echo "## macOS verification (${TAG#v})"
            echo
            echo "- dmg: ${dmg}"
            echo "- sha256: $(shasum -a 256 "$dmg" | awk '{print $1}')"
            echo "- notary submission id: ${sub_id}"
            echo
            echo "### codesign (app bundle)"
            codesign --verify --deep --strict --verbose=2 bin/OpenCraft.app
            echo
            echo "### spctl (dmg)"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            echo
            echo "### stapler validate (dmg)"
            xcrun stapler validate "$dmg"
          } | tee verification-summary.txt

      - uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: opencraft-*-macos-universal.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: macos-verification
          path: verification-summary.txt
          if-no-files-found: ignore

  linux:
    name: package (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.17

      - name: Generate bindings and build frontend
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Set release version in build assets
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          ver="${TAG#v}"
          sed -i.bak "s/version: \"0.1.0\"/version: \"$ver\"/" build/config.yml
          rm build/config.yml.bak
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task common:update:build-assets

      - name: Build Linux binary
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails3 task linux:build VERSION="${TAG#v}"

      - name: Package binary
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: tar -C bin -czf "opencraft-${TAG#v}-linux-amd64.tar.gz" opencraft

      - uses: actions/upload-artifact@v6
        with:
          name: linux-amd64
          path: opencraft-*-linux-amd64.tar.gz
          if-no-files-found: error

  windows:
    name: package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.17

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          # choco updates the machine PATH, which the runner does not reload
          # mid-job; export the NSIS bin dir so later steps can find makensis.
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis not found at $nsisDir after chocolatey install"
          }
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Generate bindings and build frontend
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          New-Item -ItemType File -Force frontend/dist/.gitkeep | Out-Null
          wails3 generate bindings -d frontend/bindings -ts -i -names ./...
          npm ci --prefix frontend
          npm run build --prefix frontend
        shell: pwsh

      - name: Set release version in build assets
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $ver = "$env:TAG".TrimStart('v')
          $config = Get-Content -Raw build/config.yml
          $config = $config -replace 'version: "0\.1\.0"', "version: `"$ver`""
          Set-Content -Encoding utf8 build/config.yml $config
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          wails3 task common:update:build-assets
        shell: pwsh

      - name: Build Windows binary + installer
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $ver = "$env:TAG".TrimStart('v')
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          wails3 task windows:package ARCH=amd64 VERSION=$ver
          if (-not (Get-ChildItem bin/opencraft-amd64-installer.exe -ErrorAction SilentlyContinue)) {
            throw "wails3 task windows:package did not produce the NSIS installer (makensis missing or failed)"
          }

      - name: Package binaries
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $ver = "$env:TAG".TrimStart('v')
          Copy-Item bin/opencraft-amd64-installer.exe `
            "opencraft-$ver-windows-amd64-installer.exe"
          Compress-Archive -Path bin/opencraft.exe `
            -DestinationPath "opencraft-$ver-windows-amd64.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64
          path: |
            opencraft-*-windows-amd64.zip
            opencraft-*-windows-amd64-installer.exe
          if-no-files-found: error

  publish:
    name: publish release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { insec=1; next }
            insec && $0 ~ "^## " { insec=0 }
            insec { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "## ${TAG}" > /tmp/release-notes.md
          fi
          {
            echo ""
            echo "## Checksums"
            for f in artifacts/opencraft-*; do
              echo "- \`$(basename "$f")\`: \`$(sha256sum "$f" | awk '{print $1}')\`"
            done
          } >> /tmp/release-notes.md
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" artifacts/opencraft-* \
            --title "$TAG" --notes-file /tmp/release-notes.md $pre
