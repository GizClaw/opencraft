name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: package (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build macOS universal app
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          jq --arg v "${TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json
          # lipo merges the arm64 + amd64 builds into one universal app.
          wails build -platform darwin/arm64,darwin/amd64 -clean \
            -ldflags "-s -w -X github.com/GizClaw/opencraft/internal/app.ServiceVersion=${TAG#v}"

      - name: Package dmg
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          app="$(find build/bin -maxdepth 1 -name '*.app' | head -1)"
          # Keep the bundle name stable for the cask regardless of the
          # wails output filename.
          mv "$app" build/bin/OpenCraft.app
          hdiutil create -volname OpenCraft -srcfolder build/bin/OpenCraft.app \
            -ov -format UDZO "opencraft-${TAG#v}-macos-universal.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: opencraft-*-macos-universal.dmg
          if-no-files-found: error

  linux:
    name: package (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Linux binary
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform linux/amd64 -clean -tags webkit2_41 \
            -ldflags "-s -w -X github.com/GizClaw/opencraft/internal/app.ServiceVersion=${TAG#v}"

      - name: Package binary
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: tar -C build/bin -czf "opencraft-${TAG#v}-linux-amd64.tar.gz" opencraft

      - uses: actions/upload-artifact@v6
        with:
          name: linux-amd64
          path: opencraft-*-linux-amd64.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { insec=1; next }
            insec && $0 ~ "^## " { insec=0 }
            insec { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "## ${TAG}" > /tmp/release-notes.md
          fi
          {
            echo ""
            echo "## Checksums"
            for f in artifacts/opencraft-*; do
              echo "- \`$(basename "$f")\`: \`$(sha256sum "$f" | awk '{print $1}')\`"
            done
          } >> /tmp/release-notes.md
          gh release create "$TAG" artifacts/opencraft-* \
            --title "$TAG" --notes-file /tmp/release-notes.md
