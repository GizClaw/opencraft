<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
  </defs>
  <!-- Apple's icon grid: artwork occupies 824x824 centred in the
       1024x1024 canvas, leaving ~100px transparent margins so the
       Dock/desktop/explorer renders it at the standard size instead of
       edge-to-edge.
       Mark: the open O ring with the terminal cursor block, bound with
       three wrapped threads at the bottom - "craft": sewing/tie-off. -->
  <g transform="translate(100,100) scale(0.8046875)">
    <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
    <rect x="232" y="232" width="560" height="560" rx="170" fill="none" stroke="#e6e9ef" stroke-width="110"/>
    <rect x="421" y="574" width="182" height="76" rx="38" fill="#4f8cff"/>
    <line x1="448" y1="737" x2="448" y2="847" stroke="#4f8cff" stroke-width="44" stroke-linecap="round"/>
    <line x1="512" y1="737" x2="512" y2="847" stroke="#4f8cff" stroke-width="44" stroke-linecap="round"/>
    <line x1="576" y1="737" x2="576" y2="847" stroke="#4f8cff" stroke-width="44" stroke-linecap="round"/>
  </g>
</svg>
