<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome macOS menu bar template icon: a heavy ">_" terminal
       prompt drawn as vector paths (the Unicode "❯" glyph is avoided
       because font fallback makes SVG-to-PNG rendering unreliable).
       Black with alpha only, so AppKit renders it in the current menu
       bar colour (dark or light).
       Convert to PNG with: rsvg-convert -w 32 -h 32 tray-icon.svg -o tray-icon.png
       (PNG is committed; regenerate after editing this file). -->
  <path d="M 6 9.5 L 17.5 16 L 6 22.5" fill="none" stroke="#000000" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16.5" y="21.5" width="13" height="4" rx="1.5" fill="#000000"/>
</svg>
