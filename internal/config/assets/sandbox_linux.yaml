version: v1

# opencraft 沙箱配置（Linux 编译版，用户可编辑，首次启动从 embed 模板
# 生成到 ~/.opencraft/config/sandbox.yaml，删除后重新生成）。
#
# ${CACHE_DIR} 在种子时替换为 ~/.opencraft/cache 的绝对路径：
# defaults.env.inject 原生注入 Go 的构建缓存/临时目录（bwrap 不允许写
# 宿主 /tmp），settings.writable_paths 放行该目录。

sandboxes:
  main:
    backend: bwrap
    workspace: main
    settings:
      writable_paths:
        - ${CACHE_DIR}
    defaults:
      timeout: 5m
      env:
        allow: [PATH, HOME]
        inject:
          GOCACHE: ${CACHE_DIR}/go
          TMPDIR: ${CACHE_DIR}/tmp
