version: v1

# opencraft 执行环境配置（用户可编辑，首次启动从 embed 种子到
# ~/.opencraft/config/execution.yaml，删除后重新生成）。
#
# mode:
#   remote（默认）：所有 exec 命令经 self-fork 的 execd 子进程
#     （JSON-RPC + unix socket）执行，进程隔离、支持长驻会话/PTY；
#   local：进程内直连沙箱 runner，低延迟、无子进程（无 PTY 会话托管）。
#
# server_url：远程 execd 地址（P2，传输未实现；留空 = self-fork）。

execution:
  mode: remote
  server_url: ""
