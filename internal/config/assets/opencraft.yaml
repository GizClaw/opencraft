version: v1

# opencraft internal deploy document (not user-editable). The base
# document is split into one layer per file: this file (core runtime
# foundations), assets/tools.yaml (tool containers + script runtime),
# assets/agents.yaml, and assets/runtime.yaml; Manager.Load registers
# each as its own embedded layer and deep-merges them in order.
# Inference wiring (provider / infer assembly / router) lives in
# assets/inference.yaml on purpose: the settings page writes the
# variable parts to ~/.opencraft/config/opencraft.yaml and the
# optional project layer can override them per repo.

resources:
  # Credential storage: the file-backed secret store feeds the
  # ${secret:keychain.<name>} scheme used by migrated inference keys
  # (and future SSO gateway tokens). The impl id "keychain" is kept so
  # existing config references keep resolving; storage is one 0600 file
  # per secret under <dataDir>/keyring on every platform, sealed at
  # rest with AES-256-GCM under a machine-local key (<dir>/.key, 0600).
  secret.keychain:
    kind: secret.Store
    impl: keychain
    settings:
      id: keychain
      default: true
      dir: ${env:OPEN_CRAFT_DATA_DIR}/keyring

  # ------------------------------------------------------------------
  # Runtime foundations: event bus, memory, session store
  # ------------------------------------------------------------------
  events:
    kind: event.Bus
    impl: memory
  mem:
    kind: memory
    impl: summary
    deps:
      sessions: sessions
      # LLM condensation routes through the inference router so it uses
      # the same user-editable routing policy as agent turns.
      router: router
    settings:
      # Raw window (max_raw_messages + preserve_recent) is the single
      # source of recent conversation context: the worldstate hook
      # injects the folded summary plus this raw window, and the session
      # archive is no longer injected into the model (it is a durability
      # store for resume/usage). 40 keeps recency parity with the older
      # session history window.
      max_raw_messages: 36
      preserve_recent: 4
      max_summary_bytes: 4096
      # Experimental: replay the full conversation history instead of
      # injecting the folded summary + raw window. Folding is then owned
      # by the graph compact node, which folds only when estimated usage
      # exceeds the model's input window. Requires reliable model window
      # metadata from the router (azure 未声明窗口元数据，开启前请确认);
      # keep false for bounded per-turn cost.
      replay_full_history: false
  # Sandbox exec policy: static allowed_commands plus the project
  # approvals file merge into one allowlist. The sandbox runner, the
  # worldstate permissions section, and request_permissions all depend
  # on this resource.
  execpolicy:
    kind: opencraft.execpolicy
    impl: manager
    deps:
      hooks: hooks
    settings:
      # Commands not in this list (or in approvals_path) ask the user
      # before running. Rules are token prefixes; "*" matches any
      # remaining arguments.
      allowed_commands: []
      # Path of the project approvals file (env-expanded); commands
      # approved via "Always allow" / request_permissions land here.
      approvals_path: ${env:OPEN_CRAFT_WORKDIR}/.opencraft/config/approvals.yaml
  # Project-scoped session store: per-session JSON (history, usage,
  # permissions, plans) under .opencraft/sessions/<id>/, plus the
  # SQLite session.db it opens at <root>/session.db (conversation
  # state tables + agent checkpoints).
  sessions:
    kind: session.Store
    impl: opencraft
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}/.opencraft/sessions
      window: 40

  # ------------------------------------------------------------------
  # Delegation: deployed agents are delegate targets; the model may
  # assign work to them via the delegate / delegation_status tools.
  # ------------------------------------------------------------------
  delegate.backend:
    kind: delegation.AsyncBackend
    impl: kanban-memory
    deps:
      event_bus: events
  delegate.directory:
    kind: delegation.Directory
    impl: local
  delegate:
    kind: delegation.Service
    impl: local
    deps:
      backend: delegate.backend
      directory: delegate.directory
    settings:
      max_concurrency: 4
      max_depth: 8

  # ------------------------------------------------------------------
  # Workspace and sandbox (box.settings.remote selects local/remote exec)
  # ------------------------------------------------------------------
  # Shared artifact sink: the desktop installs a callback that re-emits
  # workspace writes as artifact UI events; without a callback writes
  # are confined but not reported.
  artifacts:
    kind: opencraft.artifacts
    impl: local
  ws:
    kind: opencraft.workspace
    impl: local
    deps:
      observer: artifacts
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}
  # Shared skills registry: one discovery pass per process lifetime.
  # The worldstate prepare hook (per-turn top-5 injection + $mention
  # full-text activation) and tool.skills both consume it.
  skills:
    kind: opencraft.skills
    impl: local
    deps:
      workspace: ws
      plugin.host: plugin.host
    settings:
      enabled: true
      work_dir: ${env:OPEN_CRAFT_WORKDIR}
      user_dir: ${env:OPEN_CRAFT_DATA_DIR}
      top_n: 5
      min_score: 0
  # Plugin host: the desktop app injects the installed plugin store and
  # capability runtime here; CLI/headless runtimes build an empty host.
  plugin.host:
    kind: opencraft.plugins
    impl: local
  # Automation host: the desktop app injects its scheduled-task store
  # and manager here; CLI/headless runtimes build an empty host and the
  # automation tool is not exposed to the agent.
  automation.host:
    kind: opencraft.automations
    impl: local
  # Mode-aware workspace for the file tools: in workspace mode it
  # delegates to the shared ws resource (one underlying LocalWorkspace
  # for engine/system reads and tool writes) and derives its root from
  # it; in yolo mode it allows any host path. The mode is the session's
  # persisted permission state (switched with /permissions).
  hostws:
    kind: opencraft.hostworkspace
    impl: local
    deps:
      sessions: sessions
      # Reuses ws as the confined backend so all workspace-API writes
      # share a single workspace instance; the host/YOLO resolution
      # root is derived from this dependency.
      workspace: ws
      # Contributes discovered skill roots to the workspace-mode
      # read-only allowlist (read_file on references/assets).
      skills: skills
      # YOLO-mode writes report through the same artifact sink as the
      # shared ws workspace.
      observer: artifacts
    settings:
      # Staged skill copies live under the cache dir, which the exec
      # sandbox may write; file tools only need read access to it.
      readonly_roots: ["${env:OPEN_CRAFT_DATA_DIR}/cache"]
  # Network posture: exec sandbox mode (default = host networking) and
  # the web_fetch domain gate. exec.mode accepts default | deny-all |
  # allow-list | proxy; web_fetch.allow_private=false keeps the SSRF
  # guard on (private/loopback/link-local destinations are blocked).
  netpolicy:
    kind: opencraft.netpolicy
    impl: local
    settings:
      exec:
        mode: default
        allow_hosts: []
      web_fetch:
        allow_hosts: []
        deny_hosts: []
        allow_private: false
  # External lifecycle hooks: command hooks from
  # ~/.opencraft/config/hooks.json fire on PreToolUse / PostToolUse /
  # UserPromptSubmit / PermissionRequest / TurnEnd. Each command
  # receives one JSON event object on stdin; failures are logged and
  # never block the agent loop.
  hooks:
    kind: opencraft.hooks
    impl: local
    deps:
      plugin.host: plugin.host
    settings:
      path: ${env:OPEN_CRAFT_DATA_DIR}/config/hooks.json
  # Subagent hook observer: subscribes to delegation kanban events and
  # fires SubagentStart / SubagentStop hooks.
  hooks.observer:
    kind: opencraft.hooks.observer
    impl: local
    deps:
      events: events
      hooks: hooks
  box:
    kind: sandbox.Runner
    impl: opencraft
    deps:
      execpolicy: execpolicy
      sessions: sessions
      netpolicy: netpolicy
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}
      writable_paths: ["${env:OPEN_CRAFT_CACHE}"]
      remote: true
      # Sandbox environment defaults to a curated allowlist (PATH,
      # HOME, locale, toolchain, OPEN_CRAFT_* paths, ...), NOT the
      # parent environment wholesale, so provider API keys never leak
      # into sandboxed project code. Projects that need more declare
      # env_policy in their config layer.

  # ------------------------------------------------------------------
  # Script runtime
  # ------------------------------------------------------------------
  js:
    kind: agent.ScriptRuntime
    impl: js
    settings:
      pool_size: 2
