version: v1

# opencraft internal deploy document (not user-editable). The
# user-editable inference.yaml is seeded to ~/.opencraft/config/ on
# first start.

resources:
  # ------------------------------------------------------------------
  # Runtime foundations: event bus, memory, session store
  # ------------------------------------------------------------------
  events:
    kind: event.Bus
    impl: memory
  mem:
    kind: memory
    impl: summary
    deps:
      sessions: sessions
      # LLM condensation routes through the inference router so it uses
      # the same user-editable routing policy as agent turns.
      router: router
    settings:
      # Raw window (max_raw_messages + preserve_recent) is the single
      # source of recent conversation context: the worldstate hook
      # injects the folded summary plus this raw window, and the session
      # archive is no longer injected into the model (it is a durability
      # store for resume/usage). 40 keeps recency parity with the older
      # session history window.
      max_raw_messages: 36
      preserve_recent: 4
      max_summary_bytes: 4096
  # Sandbox exec policy: static allowed_commands plus the project
  # approvals file merge into one allowlist. The sandbox runner, the
  # worldstate permissions section, and request_permissions all depend
  # on this resource.
  execpolicy:
    kind: opencraft.execpolicy
    impl: manager
    settings:
      # Commands not in this list (or in approvals_path) ask the user
      # before running. Rules are token prefixes; "*" matches any
      # remaining arguments.
      allowed_commands: []
      # Path of the project approvals file (env-expanded); commands
      # approved via "Always allow" / request_permissions land here.
      approvals_path: ${env:OPEN_CRAFT_WORKDIR}/.opencraft/config/approvals.yaml
  # Project-scoped session store: per-session JSON (history, usage,
  # permissions, plans) under .opencraft/sessions/<id>/, plus the
  # SQLite session.db it opens at <root>/session.db (conversation
  # state tables + agent checkpoints).
  sessions:
    kind: session.Store
    impl: opencraft
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}/.opencraft/sessions
      window: 40

  # ------------------------------------------------------------------
  # Workspace and sandbox (box.settings.remote selects local/remote exec)
  # ------------------------------------------------------------------
  ws:
    kind: workspace.Workspace
    impl: local
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}
  # Shared skills registry: one discovery pass per process lifetime.
  # The worldstate prepare hook (per-turn top-5 injection + $mention
  # full-text activation) and tool.skills both consume it.
  skills:
    kind: opencraft.skills
    impl: local
    deps:
      workspace: ws
    settings:
      enabled: true
      work_dir: ${env:OPEN_CRAFT_WORKDIR}
      user_dir: ${env:OPEN_CRAFT_DATA_DIR}
      top_n: 5
      min_score: 0
  # Mode-aware workspace for the file tools: in workspace mode it
  # delegates to a LocalWorkspace rooted at settings.root; in yolo mode
  # it allows any host path. The mode is the session's persisted
  # permission state (switched with /permissions).
  hostws:
    kind: opencraft.hostworkspace
    impl: local
    deps:
      sessions: sessions
      # Contributes discovered skill roots to the workspace-mode
      # read-only allowlist (read_file on references/assets).
      skills: skills
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}
      # Staged skill copies live under the cache dir, which the exec
      # sandbox may write; file tools only need read access to it.
      readonly_roots: ["${env:OPEN_CRAFT_DATA_DIR}/cache"]
  box:
    kind: sandbox.Runner
    impl: opencraft
    deps:
      execpolicy: execpolicy
      sessions: sessions
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}
      writable_paths: ["${env:OPEN_CRAFT_CACHE}"]
      remote: true
      # Sandbox environment defaults to inheriting the external
      # environment wholesale. Projects that need to restrict
      # visibility or redirect caches declare env_policy in their
      # config layer (see ~/.opencraft/config/opencraft.yaml examples).

  # ------------------------------------------------------------------
  # Tool containers: each tool.Source is one tool group; tools
  # aggregates them through many deps
  # ------------------------------------------------------------------
  tool.exec:
    kind: tool.Source
    impl: opencraft/exec
    deps:
      sandbox: box
  tool.applypatch:
    kind: tool.Source
    impl: opencraft/applypatch
    deps:
      hostworkspace: hostws
  tool.webfetch:
    kind: tool.Source
    impl: opencraft/webfetch
  tool.askuser:
    kind: tool.Source
    impl: opencraft/askuser
  tool.files:
    kind: tool.Source
    impl: opencraft/files
    deps:
      hostworkspace: hostws
  tool.plan:
    kind: tool.Source
    impl: opencraft/plan
    deps:
      sessions: sessions
  tool.skills:
    kind: tool.Source
    impl: opencraft/skills
    deps:
      skills: skills
  # Internal conversation compaction: folds the loop's older rounds into
  # a summary (router condensation) and persists the artifact per
  # conversation via the session store.
  tool.compact:
    kind: tool.Source
    impl: opencraft/compact
    deps:
      router: router
      sessions: sessions
  tool.permissions:
    kind: tool.Source
    impl: opencraft/permissions
    deps:
      execpolicy: execpolicy
  tools:
    kind: tool.Assembly
    impl: opencraft
    deps:
      tool: tool.exec
      tool.applypatch: tool.applypatch
      tool.webfetch: tool.webfetch
      tool.askuser: tool.askuser
      tool.files: tool.files
      tool.plan: tool.plan
      tool.skills: tool.skills
      tool.compact: tool.compact
      tool.permissions: tool.permissions
    settings:
      middlewares:
        recover:
          enabled: true
        timeout:
          default: 5m
        # Oversized tool outputs are persisted in full under
        # .opencraft/cache/tools/<call_id>.output and truncated in
        # context, keeping the loop's MainChannel from growing unbounded
        # on a single tool result.
        truncate:
          enabled: true
          max_chars: 8000
          dir: ${env:OPEN_CRAFT_WORKDIR}/.opencraft/cache/tools
          work_dir: ${env:OPEN_CRAFT_WORKDIR}
      dynamic:
        default: deferred
        exposures:
          tool_search: always
          exec_command: always
          exec_session: always
          apply_patch: always
          ask_user: always
          read_file: always
          write_file: always
          list_dir: always
          grep: always
          glob: always
          update_plan: always
          request_permissions: always
          # Internal machinery: callable by exact name (the compact
          # graph node), never offered to the model.
          compact: hidden

  # ------------------------------------------------------------------
  # Inference: provider resources + assembly (provider is a many dep;
  # add more providers as needed)
  # ------------------------------------------------------------------
  infer:
    kind: inference.Assembly
    impl: unified
    deps:
      provider: provider.deepseek
  # Route policy: selects the target model per tier/fallback from the
  # user-editable inference.yaml (seeded to ~/.opencraft/config/).
  router:
    kind: inference.Router
    impl: unified
    deps:
      target: infer
    settings:
      file: inference.yaml
  provider.deepseek:
    kind: inference.Provider
    impl: deepseek
    settings:
      id: deepseek
      # Secrets resolve from the process environment only. There is no
      # local .env loading; inject DEEPSEEK_API_KEY via the environment
      # (systemd/systemd Environment=, k8s secrets, or your process
      # supervisor) so the key never lives on disk next to the config.
      spec:
        api: responses
      profiles:
        - secrets:
            api_key: ${env:DEEPSEEK_API_KEY}

  # ------------------------------------------------------------------
  # Script runtime
  # ------------------------------------------------------------------
  js:
    kind: agent.ScriptRuntime
    impl: js
    settings:
      pool_size: 2

agents:
  assistant:
    card:
      name: opencraft
      description: opencraft coding agent
    engine:
      kind: agent.Engine
      impl: graph
      deps:
        inference: infer
        router: router
        tools: tools
        workspace: ws
        sandbox: box
        script_runtime: js
      settings:
        # The default graph ships embedded (graph + node scripts +
        # system prompt all resolve from the binary). To use your own,
        # override this reference in the user or project layer, e.g.
        # graph: { file: graphs/my-assistant.yaml }.
        graph: { embed: assets/graphs/assistant.yaml }
        build:
          timeout: 1h
    prepare:
      - type: opencraft.prepare
        deps:
          memory: mem
          workspace: ws
          execpolicy: execpolicy
          sessions: sessions
          skills: skills
        settings:
          work_dir: ${env:OPEN_CRAFT_WORKDIR}
          user_dir: ${env:OPEN_CRAFT_DATA_DIR}
          collaboration_mode: default
          permission_profile: workspace
    commit:
      - type: opencraft.commit
        deps:
          memory: mem
          sessions: sessions
    observe:
      # Archives turns that did not complete (Ctrl+C / Esc / engine
      # errors) so /resume keeps the interrupted conversation context.
      - type: opencraft.archive
        deps:
          memory: mem
          sessions: sessions
      # Detects $name mentions in the model's replies and injects the
      # full SKILL.md on the next turn (codex-style implicit
      # invocation).
      - type: opencraft.skillactivate
        deps:
          skills: skills
          sessions: sessions

runtime:
  event_bus: events
  # The session store owns the project's session.db and serves as the
  # agent checkpoint store (one SQLite connection, one schema owner).
  checkpoint_store: sessions
  sessions:
    idle_timeout: 10m
    resume: false
  dynamic_catalog:
    tools:
      assistant: tools
