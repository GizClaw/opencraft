version: v1

# opencraft internal deploy document (not user-editable). The
# user-editable inference.yaml is seeded to ~/.opencraft/config/ on
# first start.

resources:
  # ------------------------------------------------------------------
  # Runtime foundations: event bus, persistence, memory, checkpoints
  # ------------------------------------------------------------------
  events:
    kind: event.Bus
    impl: memory
  db:
    kind: state
    impl: sqlite
  mem:
    kind: memory
    impl: summary
    deps:
      state: db
    settings:
      max_raw_messages: 32
      preserve_recent: 4
      max_summary_bytes: 4096
  # Project-scoped conversation store: full text/reasoning history per
  # session under .opencraft/sessions/<id>/history/.
  sessions:
    kind: session.Store
    impl: opencraft
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}/.opencraft/sessions
      window: 40
  checkpoints:
    kind: agent.CheckpointStore
    impl: sqlite
    settings:
      path: ${env:OPEN_CRAFT_DATA_DIR}/checkpoints.db

  # ------------------------------------------------------------------
  # Workspace and sandbox (box.settings.remote selects local/remote exec)
  # ------------------------------------------------------------------
  ws:
    kind: workspace.Workspace
    impl: local
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}
  box:
    kind: sandbox.Runner
    impl: opencraft
    settings:
      root: ${env:OPEN_CRAFT_WORKDIR}
      writable_paths: ["${env:OPEN_CRAFT_CACHE}"]
      remote: true
      # Commands not in this list (or .opencraft/approvals.yaml in the
      # project root) ask the user before running. Rules are token
      # prefixes; "*" matches any remaining arguments.
      allowed_commands: []

  # ------------------------------------------------------------------
  # Tool containers: each tool.Source is one tool group; tools
  # aggregates them through many deps
  # ------------------------------------------------------------------
  tool.exec:
    kind: tool.Source
    impl: opencraft/exec
    deps:
      sandbox: box
  tool.applypatch:
    kind: tool.Source
    impl: opencraft/applypatch
    deps:
      workspace: ws
  tool.webfetch:
    kind: tool.Source
    impl: opencraft/webfetch
  tool.askuser:
    kind: tool.Source
    impl: opencraft/askuser
  tools:
    kind: tool.Assembly
    impl: middleware
    deps:
      tool: tool.exec
      tool.applypatch: tool.applypatch
      tool.webfetch: tool.webfetch
      tool.askuser: tool.askuser
    settings:
      middlewares:
        recover:
          enabled: true
      dynamic:
        default: deferred
        exposures:
          tool_search: always
          exec_command: always
          exec_session: always
          apply_patch: always
          ask_user: always

  # ------------------------------------------------------------------
  # Inference: provider resources + assembly (provider is a many dep;
  # add more providers as needed)
  # ------------------------------------------------------------------
  infer:
    kind: inference.Assembly
    impl: unified
    deps:
      provider: provider.deepseek
  # Route policy: selects the target model per tier/fallback from the
  # user-editable inference.yaml (seeded to ~/.opencraft/config/).
  router:
    kind: inference.Router
    impl: unified
    deps:
      target: infer
    settings:
      file: inference.yaml
  provider.deepseek:
    kind: inference.Provider
    impl: deepseek
    settings:
      id: deepseek
      spec:
        api: responses
      profiles:
        - secrets:
            api_key: ${env:DEEPSEEK_API_KEY}

  # ------------------------------------------------------------------
  # Script runtime
  # ------------------------------------------------------------------
  js:
    kind: agent.ScriptRuntime
    impl: js
    settings:
      pool_size: 2

agents:
  assistant:
    card:
      name: opencraft
      description: opencraft coding agent
    engine:
      kind: agent.Engine
      impl: graph
      deps:
        inference: infer
        router: router
        tools: tools
        workspace: ws
        sandbox: box
        script_runtime: js
      settings:
        # Editable at ~/.opencraft/config/graphs/assistant.yaml
        # (regenerated when deleted). Override with your own graph via
        # the user or project layer if needed.
        graph: { file: graphs/assistant.yaml }
        build:
          timeout: 1h
    prepare:
      - type: opencraft.prepare
        deps:
          memory: mem
          workspace: ws
          sessions: sessions
        settings:
          work_dir: ${env:OPEN_CRAFT_WORKDIR}
          user_dir: ${env:OPEN_CRAFT_DATA_DIR}
          collaboration_mode: default
          permission_profile: workspace
    commit:
      - type: opencraft.commit
        deps:
          memory: mem
          sessions: sessions
    observe:
      # Archives turns that did not complete (Ctrl+C / Esc / engine
      # errors) so /resume keeps the interrupted conversation context.
      - type: opencraft.archive
        deps:
          memory: mem
          sessions: sessions

runtime:
  event_bus: events
  checkpoint_store: checkpoints
  sessions:
    idle_timeout: 10m
    resume: false
  dynamic_catalog:
    tools:
      assistant: tools
