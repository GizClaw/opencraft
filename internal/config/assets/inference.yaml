# opencraft user-editable inference routing policy
# (~/.opencraft/config/inference.yaml; deleted files are regenerated).
# This file is the settings of the router resource: it selects the
# target model per tier and configures retry / circuit breaking.
generate:
  - tier: default
    targets:
      - model:
          id:
            provider: deepseek
            name: deepseek-v4-flash
retry:
  generate:
    max_attempts: 2
    fallback_on_retry_exhausted: true
