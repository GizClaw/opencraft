version: v1

# opencraft 沙箱配置（其他平台编译版：无 sandbox-exec / bubblewrap，
# 使用 local runner）。用户可编辑，首次启动从 embed 模板生成到
# ~/.opencraft/config/sandbox.yaml。
#
# ${CACHE_DIR} 在种子时替换为 ~/.opencraft/cache 的绝对路径。

sandboxes:
  main:
    backend: local
    workspace: main
    defaults:
      timeout: 5m
      env:
        allow: [PATH, HOME]
        inject:
          GOCACHE: ${CACHE_DIR}/go
          TMPDIR: ${CACHE_DIR}/tmp
