name: opencraft-assistant
entry: world

nodes:
  - id: world
    type: script
    config:
      runtime: js
      source: {embed: assets/graphs/node/world.js}
  - id: llm
    type: inference
    config:
      all_tools: true
      tool_pending_key: tool_pending
      stream: true
      system_prompt: {embed: assets/prompts/system.md}
  - id: tools
    type: tool
    config:
      results_key: tool_results

edges:
  - {from: world, to: llm}
  - {from: llm, to: tools, condition: "tool_pending == true"}
  - {from: llm, to: __end__, condition: "tool_pending == false"}
  - {from: tools, to: llm}
