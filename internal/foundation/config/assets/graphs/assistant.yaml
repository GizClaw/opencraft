name: opencraft-assistant
entry: world

nodes:
  - id: world
    type: script
    config:
      runtime: js
      # Embedded default: the graph itself ships as an embedded asset,
      # so its node sources resolve from the binary, not the user dir.
      source: { embed: assets/graphs/nodes/world.js }
  - id: compact
    type: script
    config:
      runtime: js
      source: { embed: assets/graphs/nodes/compact.js }
      config:
        # Keep the latest rounds raw so the pending tool result stays
        # the channel tail for the next LLM call.
        preserve_recent: 10
        budget_chars: 4096
        threshold_ratio: 0.85
        max_compactions: 3
        max_input_tokens: 0
        system_prompt_tokens: 2000
  - id: llm
    type: inference
    config:
      all_tools: true
      tool_pending_key: tool_pending
      # Undefined-tool recovery: models sometimes call a tool that is
      # not exposed this round (e.g. a deferred subagent tool) before
      # tool_search selects it. Instead of failing the turn, replay the
      # rejected call with a "use tool_search" tool result and loop
      # back (see the recover_pending edge) so the model can recover.
      recover_pending_key: recover_pending
      recover_count_key: recover_count
      undefined_tool_recovery:
        enabled: true
        # Models sometimes need several rounds to fall back to
        # tool_search after calling a deferred tool by name (e.g.
        # delegation_status after delegate). The core default of 2
        # converts to a hard failure too early; 20 keeps the loop
        # bounded while giving the model room to correct.
        max_per_run: 20
      stream: true
      # Per-conversation model hint: the UI persists a "provider/name"
      # choice and injects it via agent.Request.Inputs (board.model).
      # The board-ref default keeps unset conversations on the default
      # routing policy; unknown/ambiguous hints fall back the same way.
      model_hint: ${board:model:}
      # Think level is a per-turn board input: the desktop injects
      # think_level via agent.Request.Inputs, resolving "" for models
      # without a reasoning capability (drivers reject the knob for
      # them). The empty default keeps non-desktop callers from sending
      # a knob the model may not support.
      # Per-call client metadata: opencraft.prepare seeds these board
      # vars, and providers that can forward metadata emit it as
      # client_metadata.thread_id / client_metadata.turn_id.
      request_metadata:
        thread_id: ${board:oc_thread_id}
        turn_id: ${board:oc_turn_id}
      intent:
        text:
          reasoning_effort: ${board:think_level:}
      system_prompt: { embed: assets/graphs/prompts/system.md }
      # Hosted web_search extensions (provider-side search). Flowcraft
      # addresses extensions by deployment provider id (settings.id,
      # e.g. deepseek-inst-0a1b2c3d), which a shared static graph
      # cannot enumerate. The host therefore seeds the per-run
      # extension bag as board:llm_extensions — one generate_options
      # entry per configured deployment whose generate models declare
      # hosted web search; the empty default keeps search off for
      # callers that do not seed the bag. The router's selected
      # provider activates its own entry while the others stay inert.
      # tool_choice auto (the model decides when to search) is set by
      # the host seed; deployment-specific knobs (allowed_domains,
      # user_location, search_context_size) are intentionally not
      # global defaults.
      extensions: ${board:llm_extensions:[]}
  - id: tools
    type: tool
    config:
      results_key: tool_results

edges:
  - { from: world, to: compact }
  - { from: compact, to: llm, condition: "tool_pending == false" }
  - { from: compact, to: tools, condition: "tool_pending == true" }
  - { from: llm, to: tools, condition: "tool_pending == true" }
  - { from: llm, to: compact, condition: "recover_pending == true" }
  - {
      from: llm,
      to: __end__,
      condition: "tool_pending == false && recover_pending != true",
    }
  - { from: tools, to: compact }
