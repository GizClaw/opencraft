# Runtime section. Partial embedded deploy layer: deep-merged on top
# of the base, tool, and agent layers; the user layer still wins.
runtime:
  event_bus: events
  # The session store owns the project's session.db and serves as the
  # agent checkpoint store (one SQLite connection, one schema owner).
  checkpoint_store: sessions
  sessions:
    idle_timeout: 10m
    resume: false
  # Caller-owned host values injected by the engine at assembly
  # (plugin store/capability runtime and the automation manager). They
  # are stable app objects that must survive in-place runtime reloads,
  # so they are declared here as external dependencies instead of being
  # rebuilt per generation from resource factories.
  external_deps:
    - name: plugin.host
      contract: opencraft.plugins
    - name: automation.host
      contract: opencraft.automations
  dynamic_catalog:
    tools:
      assistant: tools
