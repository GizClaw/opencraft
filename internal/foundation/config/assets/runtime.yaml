# Runtime section. Partial embedded deploy layer: deep-merged on top
# of the base, tool, and agent layers; the user layer still wins.
runtime:
  event_bus: events
  # The session store owns the project's session.db and serves as the
  # agent checkpoint store (one SQLite connection, one schema owner).
  checkpoint_store: sessions
  sessions:
    # How long an idle Session stays in memory before it is reclaimed. A
    # live Session carries its tool catalog and attached MCP clients, so
    # this is the knob that decides how much of the recently-opened
    # conversations the process keeps resident. The store below owns
    # conversation history, so reclaiming a Session costs a re-open,
    # not context.
    #
    # resume: false keeps the board out of the loop: a turn never seeds
    # from the last committed board, never parks an interrupted run and
    # cannot be replayed from its frontier. What the engine still writes
    # is one checkpoint per completed wave, and that is the crash-
    # recovery log the host replays at assembly to reconstruct a turn
    # the process never archived (L1-4). Turning resume on is a board
    # continuity decision, not a recovery prerequisite.
    idle_timeout: 3m
    resume: false
  # Caller-owned host values injected by the engine at assembly (the
  # plugin read-side host, the agent-facing plugin installer, the
  # automation manager, and the user.db stores behind long-term memory,
  # the skill lifecycle and the review queue). They are stable app
  # objects that must survive in-place runtime reloads, so they are
  # declared here as external dependencies instead of being rebuilt per
  # generation from resource factories.
  external_deps:
    - name: plugin.host
      contract: opencraft.plugins
    - name: automation.host
      contract: opencraft.automations
    - name: plugin.installer
      contract: opencraft.plugin_installer
    # The three stores live in the user database and are attached by the
    # host (Manager.OpenUserDB); the resources below pair them with
    # their document settings.
    - name: user.memory
      contract: opencraft.user_memory_store
    - name: skill.usage
      contract: opencraft.skill_usage_store
    - name: review.queue
      contract: opencraft.review_queue_store
  dynamic_catalog:
    tools:
      assistant: tools
