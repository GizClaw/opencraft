version: v1

# opencraft internal deploy document (not user-editable). The base
# document is split into one layer per file: this file (core runtime
# foundations), assets/tools.yaml (tool containers + script runtime),
# assets/agents.yaml, and assets/runtime.yaml; Manager.Load registers
# each as its own embedded layer and deep-merges them in order.
# Inference wiring (providers / infer assembly / router) is generated
# by the settings page into ~/.opencraft/config/opencraft.yaml: the
# wire-family drivers carry no vendor facts, so the deployment is the
# only place that can describe what a provider serves. Configuration is
# user-level only; workspace opencraft.yaml files are not loaded as an
# override layer.

resources:
  # Credential storage: the file-backed secret store feeds the
  # ${secret:keychain.<name>} scheme used by migrated inference keys
  # (and future SSO gateway tokens). The impl id "keychain" is kept so
  # existing config references keep resolving; storage is one 0600 file
  # per secret under <dataDir>/keyring on every platform, sealed at
  # rest with AES-256-GCM under a machine-local key (<dir>/.key, 0600).
  secret.keychain:
    kind: secret.Store
    impl: keychain
    settings:
      id: keychain
      default: true
      dir: ${ocraft:APP_HOME}/keyring

  # ------------------------------------------------------------------
  # Runtime foundations: event bus, memory, session store
  # ------------------------------------------------------------------
  events:
    kind: event.Bus
    impl: memory
  mem:
    kind: memory
    impl: summary
    deps:
      sessions: sessions
      # LLM condensation routes through the inference router so it uses
      # the same user-editable routing policy as agent turns.
      router: router
    settings:
      # Raw window (max_raw_messages + preserve_recent) is the single
      # source of recent conversation context: the worldstate hook
      # injects the folded summary plus this raw window, and the session
      # archive is no longer injected into the model (it is a durability
      # store for resume/usage). 40 keeps recency parity with the older
      # session history window.
      max_raw_messages: 36
      preserve_recent: 4
      max_summary_bytes: 4096
      # Experimental: replay the full conversation history instead of
      # injecting the folded summary + raw window. Folding is then owned
      # by the graph compact node, which folds only when estimated usage
      # exceeds the model's input window. The router reports the window
      # per model; when it cannot (azure / manually-entered models), the
      # compact node falls back to the graph's max_input_tokens setting,
      # then to a conservative 128k budget, so folding is never silently
      # disabled. Keep false for bounded per-turn cost.
      replay_full_history: false
  # Sandbox exec policy: static allowed_commands plus the workspace
  # approvals file merge into one allowlist. The sandbox runner, the
  # worldstate permissions section, and request_permissions all depend
  # on this resource.
  execpolicy:
    kind: opencraft.execpolicy
    impl: manager
    deps:
      hooks: hooks
    settings:
      # Commands not in this list (or in approvals_path) ask the user
      # before running. Rules are token prefixes; "*" matches any
      # remaining arguments.
      allowed_commands: []
      # Path of the workspace approvals file (assembly-expanded via
      # ${ocraft:APPROVALS}); commands approved via "Always allow" /
      # request_permissions land here.
      approvals_path: ${ocraft:APPROVALS}
      # Escalation decisions ("run outside the sandbox" answers) are
      # appended to <audit_dir>/escalations.jsonl. Remembered rules live
      # in escalations.yaml next to approvals.yaml, so a downgrade to a
      # build without the feature cannot drop them.
      audit_dir: ${ocraft:AUDIT_DIR}
  # Workspace session store: SQLite at the injected data root
  # (${ocraft:SESSIONS_DIR}); conversation/checkpoint tables live in
  # the workspace session.db, media/rollout stay on the filesystem.
  sessions:
    kind: session.Store
    impl: opencraft
    settings:
      root: ${ocraft:SESSIONS_DIR}
      window: 40

  # ------------------------------------------------------------------
  # User-level state (user.db): long-term memory, skill lifecycle and
  # the post-turn review queue. Each resource pairs the host-attached
  # store with the settings the settings page edits, so consumers read
  # one dependency and the page has exactly one place to write.
  # ------------------------------------------------------------------
  usermemory:
    kind: opencraft.user_memory
    impl: local
    deps:
      store: user.memory
    settings:
      # Facts that outlive a conversation (preferences, environment,
      # project conventions). Injected every turn in the cache-stable
      # prefix, bounded by count and bytes; the remember tool and an
      # accepted review suggestion both write through one store.
      enabled: true
      inject_max_items: 12
      inject_max_chars: 2048
  skilllifecycle:
    kind: opencraft.skill_lifecycle
    impl: local
    deps:
      store: skill.usage
    settings:
      # Usage events behind the per-skill counters and the curator's
      # retirement candidates. Builtin skills never participate.
      enabled: true
      stale_after_days: 45
      min_uses: 3
      usage_window_days: 90
  review:
    kind: opencraft.review
    impl: local
    deps:
      store: review.queue
    settings:
      # A post-turn review spends a model call, so it ships off: the
      # hook observes, the queue waits for the user's verdict, and
      # nothing is written into long-term memory silently.
      enabled: false
      every_turns: 5
      min_tool_calls: 4
      on_failure: true
      max_suggestions: 3
      timeout_seconds: 90
  # Inference-usage reporter for background generations (memory
  # condensation, the post-turn review): the engine registers the
  # observer factory, and this resource is what an optional `observer`
  # dependency resolves to. Runtimes without a usage observer get a
  # no-op, so the declaration never breaks an assembly.
  observer:
    kind: memory.UsageObserver
    impl: function

  # ------------------------------------------------------------------
  # Delegation: deployed agents are delegate targets; the model may
  # assign work to them via the delegate / delegation_status tools.
  # ------------------------------------------------------------------
  delegate.backend:
    kind: delegation.AsyncBackend
    impl: kanban-memory
    deps:
      event_bus: events
  delegate.directory:
    kind: delegation.Directory
    impl: local
  delegate:
    kind: delegation.Service
    impl: local
    deps:
      backend: delegate.backend
      directory: delegate.directory
    settings:
      max_concurrency: 4
      max_depth: 8
  # Curated delegation target policy: which targets the model may hand
  # work to. Empty lists allow every registered target (the default: an
  # installation that never curated a list is not silently locked
  # down); the settings page writes the lists into the user layer, and
  # the tools assembly enforces them on every delegate call.
  delegate.policy:
    kind: opencraft.delegation.policy
    impl: local

  # ------------------------------------------------------------------
  # Workspace and sandbox (box.settings.remote selects local/remote exec)
  # ------------------------------------------------------------------
  # Shared artifact sink: the desktop installs a callback that re-emits
  # workspace writes as artifact UI events; without a callback writes
  # are confined but not reported.
  artifacts:
    kind: opencraft.artifacts
    impl: local
  # Shared process feed: the sandbox runner registers every session it
  # starts inside a conversation here and drains a bounded output tail,
  # which the desktop reads back for the activity card. Without a
  # consumer the feed is still correct, just unread.
  processes:
    kind: opencraft.processes
    impl: local
  ws:
    kind: opencraft.workspace
    impl: local
    deps:
      observer: artifacts
    settings:
      root: ${ocraft:WORKDIR}
  # Shared skills registry: scans the user skill roots
  # (~/.agents/skills, <user_dir>/skills and enabled plugins' roots);
  # Reload re-runs the scan. The worldstate prepare hook (per-turn
  # top-5 injection + $mention full-text activation) and tool.skills
  # both consume it.
  skills:
    kind: opencraft.skills
    impl: local
    deps:
      plugin.host: plugin.host
      # Optional: the user.db skill lifecycle store. Without it the
      # registry records no usage and never filters a retired skill.
      skilllifecycle: skilllifecycle
    settings:
      enabled: true
      user_dir: ${ocraft:APP_HOME}
      top_n: 5
      min_score: 0
      # Where the curator writes its tar.gz snapshots: retiring a skill
      # is always reversible, so the snapshot outlives the decision.
      archive_dir: ${ocraft:APP_HOME}/skills-archive
  # Mode-aware workspace for the file tools: in workspace mode it
  # delegates to the shared ws resource (one underlying LocalWorkspace
  # for engine/system reads and tool writes) and derives its root from
  # it; in yolo mode it allows any host path. The mode is the session's
  # persisted permission state (switched with /permissions).
  hostws:
    kind: opencraft.hostworkspace
    impl: local
    deps:
      sessions: sessions
      # Reuses ws as the confined backend so all workspace-API writes
      # share a single workspace instance; the host/YOLO resolution
      # root is derived from this dependency.
      workspace: ws
      # Contributes discovered skill roots to the workspace-mode
      # read-only allowlist (read_file on references/assets).
      skills: skills
      # YOLO-mode writes report through the same artifact sink as the
      # shared ws workspace.
      observer: artifacts
    settings:
      # Staged skill copies live under the cache dir, which the exec
      # sandbox may write; file tools only need read access to it.
      readonly_roots: ["${ocraft:CACHE}"]
  # Network posture: exec sandbox mode (default = host networking) and
  # the web_fetch domain gate. exec.mode accepts default | deny-all |
  # allow-list | proxy; web_fetch.allow_private=false keeps the SSRF
  # guard on (private/loopback/link-local destinations are blocked).
  netpolicy:
    kind: opencraft.netpolicy
    impl: local
    settings:
      exec:
        mode: default
        allow_hosts: []
      web_fetch:
        allow_hosts: []
        deny_hosts: []
        allow_private: false
  # External lifecycle hooks: command hooks from
  # ~/.opencraft/config/hooks.json fire on PreToolUse / PostToolUse /
  # UserPromptSubmit / PermissionRequest / TurnEnd. Each command
  # receives one JSON event object on stdin; failures are logged and
  # never block the agent loop.
  hooks:
    kind: opencraft.hooks
    impl: local
    deps:
      plugin.host: plugin.host
    settings:
      path: ${ocraft:APP_HOME}/config/hooks.json
  # Subagent hook observer: subscribes to delegation kanban events and
  # fires SubagentStart / SubagentStop hooks.
  hooks.observer:
    kind: opencraft.hooks.observer
    impl: local
    deps:
      events: events
      hooks: hooks
  box:
    kind: sandbox.Runner
    impl: opencraft
    deps:
      execpolicy: execpolicy
      sessions: sessions
      netpolicy: netpolicy
      processes: processes
    settings:
      root: ${ocraft:WORKDIR}
      writable_paths: ["${ocraft:CACHE}"]
      # Sandbox scratch root the execd child creates and writes
      # (Go build cache, tmp); it belongs to the state root, which the
      # parent knows and the child must not resolve.
      cache_dir: ${ocraft:CACHE}
      remote: true
      # Sandbox environment defaults to a curated allowlist (PATH,
      # HOME, locale, toolchain, opencraft path vars, ...), NOT the
      # parent environment wholesale, so provider API keys never leak
      # into sandboxed project code. Projects that need more declare
      # env_policy in their config layer.

  # ------------------------------------------------------------------
  # Script runtime
  # ------------------------------------------------------------------
  js:
    kind: agent.ScriptRuntime
    impl: js
    settings:
      pool_size: 2
