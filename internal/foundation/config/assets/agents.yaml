# Agent definitions. Partial embedded deploy layer: deep-merged on
# top of the base and tool layers; the user layer still wins.
agents:
  assistant:
    card:
      name: opencraft
      description: opencraft coding agent
    engine:
      kind: agent.Engine
      impl: graph
      deps:
        inference: infer
        router: router
        tools: tools
        workspace: ws
        sandbox: box
        script_runtime: js
      settings:
        # The default graph ships embedded (graph + node scripts +
        # system prompt all resolve from the binary). To use your own,
        # override this reference in the user layer, e.g.
        # graph: { file: graphs/my-assistant.yaml }.
        graph: { embed: assets/graphs/assistant.yaml }
        build:
          # flowcraft's loop guard counts routed nodes (a skipped node
          # still routes), and each tool round in this graph runs
          # compact + llm + tools (3 nodes). 0 lifts the guard so long
          # implementation work is never cut off by a node budget, and
          # neither build.timeout nor policy.run_timeout is declared: a
          # turn ends when its work does or the user stops it.
          max_iterations: 0
    prepare:
      # Attachments are made drivable here, before the engine reads the
      # board: a local file is inlined as bytes (no provider can fetch a
      # path off the host), and a kind the deployment does not pass
      # through is flattened into a path line the file tools can still
      # reach. audio/video/file are flattened by default, because the
      # hook runs before routing and a model that declares no such input
      # rejects the request rather than ignoring the part; a deployment
      # whose models take e.g. video sets `passthrough_kinds: [video]`
      # in its user layer knowingly.
      #
      # The markers stay the Chinese ones sessions already recorded, so
      # moving the hook to flowcraft's core/media/hook does not change
      # the prompt text a turn carries.
      - type: media.attachments
        settings:
          work_dir: ${ocraft:WORKDIR}
          image_marker: "[图片文件] "
          audio_marker: "[音频文件] "
          video_marker: "[视频文件] "
          file_marker: "[一般文件] "
      - type: opencraft.prepare
        deps:
          memory: mem
          workspace: ws
          execpolicy: execpolicy
          sessions: sessions
          skills: skills
          # Optional: the user-level long-term memory binding. A runtime
          # without a user database injects no memory section.
          usermemory: usermemory
        settings:
          work_dir: ${ocraft:WORKDIR}
          user_dir: ${ocraft:APP_HOME}
          collaboration_mode: default
          # Optional personality overlay for the worldstate instruction
          # layer: "friendly" or "pragmatic". Empty keeps the neutral
          # default; unknown values degrade to neutral with a warning.
          personality: ""
          permission_profile: workspace
    commit:
      - type: opencraft.commit
        deps:
          memory: mem
          sessions: sessions
      # Records the provider-measured prompt size of the turn so the next
      # turn's fold decision starts from a measurement instead of a
      # character estimate (worldstate's usage anchor).
      - type: opencraft.usageanchor
        deps:
          sessions: sessions
    observe:
      # Archives turns that did not complete (Ctrl+C / Esc / engine
      # errors) so /resume keeps the interrupted conversation context.
      - type: opencraft.archive
        deps:
          memory: mem
          sessions: sessions
      # Detects $name mentions in the model's replies and injects the
      # full SKILL.md on the next turn (codex-style implicit
      # invocation).
      - type: opencraft.skillactivate
        deps:
          skills: skills
          sessions: sessions
      # Post-turn write-back review: after a turn that looks worth
      # reviewing (the configured cadence, enough tool use, or a
      # failure) one bounded inference call proposes durable facts and
      # queues them for the user's verdict. Off by default; nothing is
      # written into long-term memory without acceptance.
      - type: opencraft.review
        deps:
          queue: review
          memory: usermemory
          skills: skills
          sessions: sessions
          router: router
          observer: observer
        # The workspace the reviewed turn ran in: a workspace-scoped
        # fact is filed under it, and it is the key the prompt lists
        # the already-stored facts by. Without it the store refuses
        # every workspace candidate.
        settings:
          work_dir: ${ocraft:WORKDIR}
